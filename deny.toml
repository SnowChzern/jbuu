# cargo-deny 配置（WP-04 依赖基线）。运行：cargo deny check
# 质量门默认跑 licenses/bans/sources；advisories 需要联网拉漏洞库，
# 由 scripts/quality-gate.sh 在 DENY_ADVISORIES=1 时附加。

[graph]
targets = [{ triple = "x86_64-unknown-linux-gnu" }]
all-features = true

[advisories]
version = 2
# yanked 依赖一律拒绝（供应链纪律）
yanked = "deny"
ignore = []

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
deny = []
skip = []

[licenses]
version = 2
# workspace 内部 crate 不做许可检查（publish = false）
private = { ignore = true }
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "Unicode-3.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
]
# 新增许可须附理由并过 CODEOWNERS 供应链评审；未遇到项会被警告提醒清理。
# 2026-09-14 核对结论（任务 #60，勿误加项）：
#  - 现有 100 个锁定的第三方依赖（Cargo.lock）全部被上述白名单覆盖，无例外；
#  - "Unlicense OR MIT"（memchr/termcolor/winapi-util）与旧式 "MIT/Apache-2.0"、
#    "Apache-2.0/MIT"（斜杠写法=OR）均按 MIT/Apache-2.0 宽松分支采纳，
#    无需将 Unlicense 加白；
#  - r-efi 的 "MIT OR Apache-2.0 OR LGPL-2.1-or-later"：LGPL 仅为 OR 分支，
#    本项目按 MIT/Apache-2.0 分支采纳，LGPL-2.1-or-later **不进白名单**；
#  - 本白名单只约束第三方依赖，不限制项目自身采用 GPL-3.0-or-later；
#    Apache-2.0 与 GPLv3 兼容（非 GPLv2 口径）。
confidence-threshold = 0.93

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# rsproxy 是 crates.io 的替换镜像（.cargo/config.toml），两者都放行
allow-registry = [
    "https://github.com/rust-lang/crates.io-index",
    "sparse+https://rsproxy.cn/index/",
]
allow-git = []
